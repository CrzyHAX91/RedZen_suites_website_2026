name: Booking quality
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: booking-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Verify Vercel client build with a synthetic project target (no deployment)
        run: npm run build:vercel
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
          VERCEL_PROJECT_ID: prj_RedZenTest
          REDZEN_VERCEL_PROJECT_ID: prj_RedZenTest

  dependency-audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --engine-strict --ignore-scripts --no-audit --no-fund
      - name: Check production and development dependencies for high or critical advisories
        run: npm audit --audit-level=high

  postgres-integration:
    name: Isolated PostgreSQL storage and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: redzen_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --engine-strict --no-audit --no-fund
      - name: Verify real storage, permissions, concurrency, outage, restore and cleanup
        run: node --import tsx --test integration/postgres.test.ts
        env:
          PG_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
