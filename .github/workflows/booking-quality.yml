name: Booking quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Verify Vercel client build with a synthetic project target (no deployment)
        run: npm run build:vercel
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
          VERCEL_PROJECT_ID: prj_RedZenTest
          REDZEN_VERCEL_PROJECT_ID: prj_RedZenTest

